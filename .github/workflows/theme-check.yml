name: Theme Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # shopify/theme-check-action@v2 crashes on the Node 24 runners
      # ('e.filter is not a function', Oct 2026). Same check, run via the CLI.
      - name: Run Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error --output text
